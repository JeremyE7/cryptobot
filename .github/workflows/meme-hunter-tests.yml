name: Meme Hunter Tests

on:
  push:
    paths:
      - "meme-hunter/**"
      - ".github/workflows/meme-hunter-tests.yml"
  pull_request:
    paths:
      - "meme-hunter/**"
      - ".github/workflows/meme-hunter-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: meme-hunter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: meme-hunter/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
